<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Track Todo</title>
  <link rel="stylesheet" href="styles.css?v=20260808">
</head>
<body>
  <main class="app-shell">
    <section class="planner" aria-label="Todo planner">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal planner</p>
          <h1>Daily Track</h1>
        </div>
        <div class="header-actions">
          <p class="selected-date-pill" id="selectedDatePill"></p>
          <button class="summary-toggle" type="button" id="summaryToggle" aria-expanded="false">Summary</button>
          <button class="overdue-toggle" type="button" id="overdueToggle" aria-pressed="false">Overdue</button>
          <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch to light theme">Light</button>
        </div>
      </header>

      <section class="quick-stats" aria-label="Task progress">
        <div class="stat">
          <span id="statPlannedDays">0</span>
          <p>Tasks today</p>
        </div>
        <div class="stat">
          <span id="statTodo">0</span>
          <p>To do</p>
        </div>
        <div class="stat progress-stat">
          <span id="statInProgress">0</span>
          <p>In progress</p>
        </div>
        <div class="stat done-stat">
          <span id="statDone">0%</span>
          <p>Complete</p>
        </div>
      </section>

      <section class="analytics-strip" id="analyticsStrip" aria-label="Completion summary" hidden>
        <article class="summary-card">
          <div>
            <p class="section-label">Day</p>
            <h3 id="daySummaryTitle">Selected day</h3>
          </div>
          <div class="summary-chart" id="daySummaryChart"></div>
        </article>
        <article class="summary-card">
          <div>
            <p class="section-label">Week</p>
            <h3 id="weekSummaryTitle">This week</h3>
          </div>
          <div class="summary-chart" id="weekSummaryChart"></div>
        </article>
        <article class="summary-card">
          <div>
            <p class="section-label">Month</p>
            <h3 id="monthSummaryTitle">This month</h3>
          </div>
          <div class="summary-chart" id="monthSummaryChart"></div>
        </article>
      </section>

      <section class="planner-body">
        <aside class="calendar-panel" aria-label="Calendar selector">
          <div class="calendar-heading">
            <div>
              <p class="section-label">Calendar</p>
              <h2 id="calendarTitle">Month</h2>
            </div>
            <button class="text-button compact" type="button" id="todayButton">Today</button>
          </div>

          <div class="calendar-controls" aria-label="Calendar controls">
            <button class="icon-button" type="button" id="previousMonth" aria-label="Previous month">&lt;</button>
            <label class="month-field">
              <span>Month</span>
              <select id="monthSelect" aria-label="Select month"></select>
            </label>
            <label class="year-field">
              <span>Year</span>
              <input id="yearInput" type="number" min="1970" max="2100" step="1">
            </label>
            <button class="icon-button" type="button" id="nextMonth" aria-label="Next month">&gt;</button>
          </div>

          <div class="calendar-legend" aria-label="Task status legend">
            <span><i class="dot todo"></i>To do</span>
            <span><i class="dot in-progress"></i>In progress</span>
            <span><i class="dot done"></i>Done</span>
          </div>

          <div class="month-calendar" id="monthCalendar"></div>
        </aside>

        <section class="day-workspace" aria-label="Selected day tasks">
          <div class="selected-day-card">
            <div>
              <p class="section-label">Selected day</p>
              <h2 id="selectedDateTitle"></h2>
            </div>
            <div class="selected-day-stats" id="selectedDayStats"></div>
          </div>

          <form class="task-form" id="taskForm">
            <label class="task-title-field">
              <span>Task</span>
              <input id="taskTitle" name="title" type="text" placeholder="Task for this day" autocomplete="off" required>
            </label>
            <label>
              <span>Priority</span>
              <select id="taskPriority" name="priority">
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </label>
            <button type="submit">Add task</button>
          </form>

          <div class="panel-heading">
            <h3>Tasks</h3>
            <button class="text-button" type="button" id="clearDone">Clear done</button>
          </div>
          <p class="status-message" id="statusMessage"></p>
          <ul class="task-list" id="taskList"></ul>
          <div class="empty-state" id="emptyState">
            <h3>No tasks for this day</h3>
            <p>Select a date from the side calendar and add what belongs there.</p>
          </div>
        </section>
      </section>
    </section>
  </main>

  <script src="config.js?v=20260808"></script>
  <script src="app.js?v=20260808"></script>
</body>
</html>
